# Specialist catalog. Weights are never downloaded at application startup.
# Set enabled: true and a local weights_path only after a checkpoint is on disk.

models:
  - id: geochat_vqa
    name: GeoChat-7B
    version: "7B"
    capabilities: [vqa]
    adapter: satquery.models.geochat.GeoChatVLMModel
    capability: image_vqa
    enabled: false
    weights_path: null
    notes: Not loaded until weights exist locally.

  - id: geochat_caption
    name: GeoChat-7B
    version: "7B"
    capabilities: [caption]
    adapter: satquery.models.geochat.GeoChatVLMModel
    capability: image_caption
    enabled: false
    weights_path: null
    notes: Not loaded until weights exist locally.

  - id: geochat_grounding
    name: GeoChat-7B
    version: "7B"
    capabilities: [grounding]
    adapter: satquery.models.geochat.GeoChatVLMModel
    capability: grounding
    enabled: false
    weights_path: null
    notes: Not loaded until weights exist locally.

  - id: opencd_bit_change
    name: Open-CD BIT ResNet-18
    version: r18-levir
    capabilities: [change_detect]
    adapter: satquery.models.opencd_bit.OpenCDBITModel
    enabled: true
    weights_path: models/checkpoints/bit_r18_256x256_40k_levircd.pth
    tile_size: 256
    tile_overlap: 0.25
    change_threshold: 0.5
    batch_size: 4
    min_change_region_pixels: 20
    max_regions_visualized: 20
    device: auto
    notes: Pretrained Open-CD BIT model on LEVIR-CD with tiled sliding-window inference and region extraction.

  - id: cdvqa_baseline
    name: CDVQA baseline
    version: paper-2022
    capabilities: [change_vqa]
    adapter: satquery.models.unconfigured.UnconfiguredChangeVQAModel
    enabled: false
    weights_path: null
    notes: Specialist integration deferred.

  - id: bigearthnet_resnet50_s1s2
    name: BigEarthNet v2 ResNet-50 S2
    version: v0.2.0
    capabilities: [classification, land_cover]
    adapter: satquery.models.bigearthnet.BigEarthNetModel
    enabled: true
    weights_path: models/checkpoints/resnet50_s2_v0.2.0.pth
    threshold: 0.3
    device: auto
    notes: Pretrained on BigEarthNet v2.0 (reBEN) Sentinel-2 benchmark (19 Corine Land Cover classes).


tools:
  - id: geotiff_reader
    name: GeoTIFF reader
    enabled: true
  - id: image_preprocessing
    name: Image preprocessing
    enabled: true
  - id: visualization
    name: Visualization
    enabled: true
  - id: change_map_generation
    name: Change-map generation
    enabled: true

# Specialist catalog. Weights are never downloaded at application startup.
# Set enabled: true and a local weights_path only after a checkpoint is on disk.

models:
  - id: geochat_vqa
    name: GeoChat-7B
    version: "7B"
    capabilities: [vqa]
    adapter: satquery.models.unconfigured.UnconfiguredVQAModel
    enabled: false
    weights_path: null
    notes: Not implemented in this foundation. Do not auto-download.

  - id: geochat_caption
    name: GeoChat-7B
    version: "7B"
    capabilities: [caption]
    adapter: satquery.models.unconfigured.UnconfiguredCaptioningModel
    enabled: false
    weights_path: null
    notes: Not implemented in this foundation.

  - id: geochat_grounding
    name: GeoChat-7B
    version: "7B"
    capabilities: [grounding]
    adapter: satquery.models.unconfigured.UnconfiguredGroundingModel
    enabled: false
    weights_path: null
    notes: Not implemented in this foundation.

  - id: opencd_bit_change
    name: Open-CD BIT ResNet-18
    version: r18-levir
    capabilities: [change_detect]
    adapter: satquery.models.opencd_bit.OpenCDBITModel
    enabled: true
    weights_path: models/checkpoints/bit_r18_256x256_40k_levircd.pth
    notes: Pretrained Open-CD BIT model on LEVIR-CD.

  - id: cdvqa_baseline
    name: CDVQA baseline
    version: paper-2022
    capabilities: [change_vqa]
    adapter: satquery.models.unconfigured.UnconfiguredChangeVQAModel
    enabled: false
    weights_path: null
    notes: Specialist integration deferred.

  - id: bigearthnet_resnet50_s1s2
    name: BigEarthNet v2 ResNet-50 S1+S2
    version: v0.2.0
    capabilities: [optical_sar_fusion, land_cover]
    adapter: satquery.models.unconfigured.UnconfiguredOpticalSARModel
    enabled: false
    weights_path: null
    rs_adapted: true
    notes: M1 target. Not loaded until weights exist locally.

tools:
  - id: geotiff_reader
    name: GeoTIFF reader
    enabled: true
  - id: image_preprocessing
    name: Image preprocessing
    enabled: true
  - id: visualization
    name: Visualization
    enabled: true
  - id: change_map_generation
    name: Change-map generation
    enabled: true
